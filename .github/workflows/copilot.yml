name: Copilot CLI Automation
on:
  pull_request:
    types: [opened, edited]

jobs:
  copilot-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22 # Copilot CLI requires Node.js 22+

      - name: Install Copilot CLI
        run: npm i -g @github/copilot

      - name: Run Copilot Command
        env:
          # Inject your PAT into the CLI environment
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }} 
        run: |
          copilot --model gpt-4 \
            -p "Use the review-doc-organizer  agent and perform a code review." \
            -s --no-ask-user
